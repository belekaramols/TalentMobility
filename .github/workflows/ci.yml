name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build-api:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet restore TalentMobility.sln
      - run: dotnet build TalentMobility.sln --no-restore -c Release
      - run: dotnet test TalentMobility.sln --no-build -c Release

  build-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/TalentMobility.Web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run build
